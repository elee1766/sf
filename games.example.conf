# steamflags game config
# [default] applies to all games, [appid] overrides per game
# KEY=value to set, -KEY to unset, # for comments
#
# [scrub] unsets env vars matching patterns (regex)
# one pattern per line

[scrub]
KEY$
TOKEN$
SECRET
CREDENTIAL
PASSWORD

[default]
## enable mangohud by default on all games
MANGOHUD=1
# enable gamemoderun
SF_GAMEMODE=1

# gamescope is disable by default, you can uncomment this to enable it
#SF_GAMESCOPE=1
## configure gamescope. meaningless if SF_GAMESCOPE is unset
SF_GAMESCOPE_W=1920
SF_GAMESCOPE_H=1080
SF_GAMESCOPE_R=360
#SF_GAMESCOPE_EXTRA=--force-grab-cursor --immediate-flips

[730] # cs2, no mangohud
MANGOHUD=0
#-MANGOHUD # this syntax is also valid

[1304930] # outlast trials, show DXVK HUD
DXVK_HUD=compiler,pipelines
